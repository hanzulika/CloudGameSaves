name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test SaveCloud.Tests -c Release

      - name: Build app
        run: dotnet build SaveCloud/SaveCloud.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: SaveCloud
          path: |
            SaveCloud/bin/Release/net481/
            !SaveCloud/bin/Release/net481/*.pdb
